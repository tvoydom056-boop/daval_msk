@media (pointer: coarse) {
  .viz-carousel:has(&gt; .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker &gt; summary,
  .form-control,
  .form-select {
    --btn-size: 44px;
    min-width: 44px;
    min-height: 44px;
  }

  .form-select {

    font-size: max(
      16px,
      round(nearest, calc(var(--font-size-base) * 14 / 16), 1px)

  }
  .form-control:is(
    [type=&quot;file&quot;],
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;week&quot;],
    [type=&quot;time&quot;],
    [type=&quot;color&quot;]
  ) {
    height: 44px;
    min-height: 44px;
    font-size: max(16px, calc(var(--font-size-base) * 14 / 16));
    font-size: max(
      16px,
      round(nearest, calc(var(--font-size-base) * 14 / 16), 1px)
    );
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]

    min-width: 0;
    max-width: 100%;

  .form-check {

  .form-check-input {

    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }
}

svg {

#widget &gt; svg {

#povod-directions{width:100%}
#povod-directions .pv-variant{min-height:800px}
#povod-directions .pv-page{--pv-paper:#fff8ed;--pv-ink:#2d302c;--pv-accent:#d9533e;background:var(--pv-paper);color:var(--pv-ink);font:400 15px/1.45 PovodOnest,Arial,sans-serif;min-height:700px;box-sizing:border-box;overflow:clip;display:flex;flex-direction:column}
#povod-directions .pv-page *{box-sizing:border-box}
#povod-directions .pv-page h1,#povod-directions .pv-page h2,#povod-directions .pv-page p{margin:0;color:inherit;line-height:inherit;font-family:inherit}
#povod-directions .pv-nav{display:flex;align-items:center;justify-content:space-between;padding:23px 34px;gap:20px;border-bottom:1px solid color-mix(in srgb,var(--pv-ink) 18%,transparent)}
#povod-directions .pv-brand{font-size:25px;font-weight:800;letter-spacing:-1.3px}
#povod-directions .pv-nav-text{font-size:12px;text-align:right}
#povod-directions .pv-page h1{font-size:clamp(34px,5.5vw,67px);font-weight:700;line-height:.99;letter-spacing:-2.9px;text-wrap:balance}
#povod-directions .pv-eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:500}
#povod-directions .pv-copy{font-size:15px;line-height:1.55;max-width:350px}
#povod-directions .pv-btn{border:0;background:var(--pv-accent);color:#fffef9;font:500 13px/1.2 PovodOnest,Arial,sans-serif;min-height:46px;padding:13px 23px;border-radius:2px;cursor:pointer;transition:transform .16s,filter .16s}
#povod-directions .pv-btn:hover{filter:brightness(.95);transform:translateY(-2px)}
#povod-directions .pv-btn:active{transform:translateY(1px)}
#povod-directions .pv-page button:focus-visible{outline:3px solid var(--pv-ink);outline-offset:4px}
#povod-directions .pv-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:38px;align-items:center;padding:48px 34px 32px;min-height:550px}
#povod-directions .pv-stack{display:flex;flex-direction:column;align-items:flex-start;gap:25px;min-width:0}
#povod-directions .pv-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin: auto 34px 0;padding:19px 0;border-top:1px solid color-mix(in srgb,var(--pv-ink) 18%,transparent);font-size:11px;letter-spacing:.2px}
#povod-directions .pv-photo{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
#povod-directions .pv-notes{padding-top:14px;display:grid;gap:7px;color:var(--foreground);font-size:var(--font-size-base)}
#povod-directions .pv-notes a{width:fit-content}
#povod-directions .pv-tabs{display:flex;flex-wrap:wrap;gap:7px}
#povod-directions .pv-tab{border:1px solid color-mix(in srgb,var(--pv-ink) 35%,transparent);padding:10px 12px;min-height:44px;background:transparent;color:inherit;font:400 12px PovodOnest,Arial,sans-serif;cursor:pointer;border-radius:1px}
#povod-directions .pv-tab[aria-pressed=true]{background:var(--pv-ink);color:var(--pv-paper);border-color:var(--pv-ink)}
#povod-directions .pv-small{font-size:12px}
#povod-directions .pv-page [hidden]{display:none!important}
#povod-directions .pv-reveal{font-size:14px;max-width:350px;padding-top:4px}
#povod-directions .pv-letter{--pv-paper:#f9ede4;--pv-ink:#4b3029;--pv-accent:#bd4935}
#povod-directions .pv-envelope-stage{display:flex;align-items:center;justify-content:center;position:relative;min-height:340px;padding-top:20px}
#povod-directions .pv-envelope{width:100%;max-width:370px;height:220px;background:#dfae97;position:relative;border:1px solid #c68d76}
#povod-directions .pv-envelope:after{content:&quot;&quot;;position:absolute;inset:0;background:#ecc2ae;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:2;pointer-events:none}
#povod-directions .pv-envelope .pv-letter-paper{position:absolute;left:7%;width:86%;top:12px;height:185px;padding:20px;background:#fffaf1;z-index:1;transition:transform .6s}
#povod-directions .pv-letter-paper strong{display:block;font:400 27px/1.1 PovodLetter,cursive;margin:10px 0}
#povod-directions .pv-letter-paper img{width:80px;height:64px;object-fit:cover;float:right;margin-left:10px}
#povod-directions .pv-envelope.is-open .pv-letter-paper{transform:translateY(-105px);z-index:3}
#povod-directions .pv-envelope-label{position:absolute;z-index:3;bottom:26px;left:24px;right:24px;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#4b3029}
#povod-directions .pv-album{--pv-paper:#f2f1e8;--pv-ink:#263a4d;--pv-accent:#315ccb}
#povod-directions .pv-album-grid{display:grid;grid-template-columns:1.2fr .85fr;gap:12px;align-items:start}
#povod-directions .pv-print{background:#fffdf5;padding:10px 10px 25px;box-shadow:0 3px 8px #25344814}
#povod-directions .pv-print img{height:255px}
#povod-directions .pv-print-small{margin-top:95px;padding:8px 8px 22px}
#povod-directions .pv-print-small img{height:155px}
#povod-directions .pv-print-line{height:3px;background:#b9b7ad;width:50%;margin-top:15px}
#povod-directions .pv-magazine{--pv-paper:#fff6e8;--pv-ink:#c0362e;--pv-accent:#c0362e}
#povod-directions .pv-mag-top{padding:21px 34px 5px;display:flex;justify-content:space-between;gap:15px;font-size:11px}
#povod-directions .pv-magazine h1{font-size:clamp(45px,8.8vw,100px);line-height:.9;letter-spacing:-5px;padding:10px 34px 25px;font-weight:800}
#povod-directions .pv-mag-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;padding:0 34px 28px;align-items:end}
#povod-directions .pv-mag-photo{height:247px}
#povod-directions .pv-mag-story{border-top:1px solid var(--pv-ink);padding-top:15px;font-size:14px}
#povod-directions .pv-mag-story h2{font-size:29px;letter-spacing:-1px;line-height:1.1;margin-bottom:14px}
#povod-directions .pv-mag-caption{display:flex;justify-content:space-between;font-size:11px;padding-top:8px}
#povod-directions .pv-booth{--pv-paper:#d9ecf3;--pv-ink:#174558;--pv-accent:#174558}
#povod-directions .pv-booth-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:30px;align-items:center;padding:35px 34px;min-height:550px}
#povod-directions .pv-film{background:#fffdf4;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:380px;justify-self:end}
#povod-directions .pv-film button{border:0;background:none;padding:0;cursor:pointer;min-width:0;aspect-ratio:1}
#povod-directions .pv-film button img{filter:grayscale(1);transition:filter .25s}
#povod-directions .pv-film button[aria-pressed=true] img{filter:grayscale(0)}
#povod-directions .pv-film-footer{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11px;padding:4px}
#povod-directions .pv-memory{font-size:15px;font-weight:500;min-height:22px}
#povod-directions .pv-poster{--pv-paper:#ffdd4b;--pv-ink:#312a29;--pv-accent:#a43a28}
#povod-directions .pv-poster-body{padding:28px 34px 35px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.7fr);gap:24px;align-items:end;min-height:550px}
#povod-directions .pv-poster-body&gt;div{min-width:0}
#povod-directions .pv-poster h1{font-size:clamp(70px,11vw,133px);font-weight:800;line-height:.82;letter-spacing:-7px;margin-top:23px}
#povod-directions .pv-poster-aside{display:flex;flex-direction:column;gap:18px}
#povod-directions .pv-poster-aside img{height:140px;max-width:210px}
#povod-directions .pv-poster-type{font-size:16px;text-transform:uppercase;font-weight:500;letter-spacing:1px}
#povod-directions .pv-route{--pv-paper:#eaf0e2;--pv-ink:#314c38;--pv-accent:#426747}
#povod-directions .pv-route-layout{padding:35px 34px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:35px;min-height:550px;align-items:center}
#povod-directions .pv-route-layout h1{font-size:clamp(34px,4.8vw,59px)}
#povod-directions .pv-stations{display:flex;flex-direction:column;gap:0;position:relative;border-left:2px solid #b1c7a7;margin-left:7px}
#povod-directions .pv-station{position:relative;border:0;background:transparent;color:var(--pv-ink);font:400 14px PovodOnest,Arial,sans-serif;text-align:left;min-height:48px;padding:12px 0 12px 25px;cursor:pointer}
#povod-directions .pv-station:before{content:&quot;&quot;;width:10px;height:10px;position:absolute;left:-6px;top:19px;background:var(--pv-paper);border:2px solid #426747}
#povod-directions .pv-station[aria-pressed=true]:before{background:#426747}
#povod-directions .pv-station[aria-pressed=true]{font-weight:700}
#povod-directions .pv-route-photo{height:300px;margin-bottom:16px}
#povod-directions .pv-museum{--pv-paper:#f1eadb;--pv-ink:#4d4e37;--pv-accent:#64683d}
